<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cache Warmup</title>
<meta name="description" content="Fourteen short, interactive lessons to refresh software engineering fundamentals and practice interview answers.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='10' height='10' rx='2' fill='%23E9BE00'/%3E%3Crect x='12' width='10' height='10' rx='2' fill='%23131A22'/%3E%3Crect y='12' width='10' height='10' rx='2' fill='%23131A22'/%3E%3Crect x='12' y='12' width='10' height='10' rx='2' fill='%23131A22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook on graph paper. Wide screens get a dashboard (path + memory hierarchy);
   lessons play in one focused reading column, one step at a time. Highlighter marks key terms. */
:root {
  --paper: #E7EBEF;
  --grid: rgba(36, 72, 214, .055);
  --sheet: #FCFDFD;
  --ink: #131A22;
  --ink-2: #4A5866;
  --ink-3: #75828F;
  --rule: #D2D9E0;
  --hl: #FFE14A;
  --hl-strong: #E9BE00;
  --cobalt: #2448D6;
  --cobalt-soft: rgba(36, 72, 214, .09);
  --good: #0E7546;
  --good-bg: #E2F3E9;
  --bad: #B3261E;
  --bad-bg: #FBE8E6;
  --margin: #E25A5A;
  --code-bg: #EEF1F5;
  --shadow: 0 1px 0 rgba(19, 26, 34, .04), 0 10px 28px -14px rgba(19, 26, 34, .22);

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --step--1: .8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.4rem, 6vw, 3.6rem);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1217; --grid: rgba(124, 155, 255, .045); --sheet: #151C23; --ink: #E6EBEF; --ink-2: #A4B1BD; --ink-3: #74828E;
    --rule: #26303A; --hl: rgba(255, 214, 60, .32); --hl-strong: #F2CC3A; --cobalt: #86A2FF; --cobalt-soft: rgba(134, 162, 255, .13);
    --good: #57D08F; --good-bg: rgba(87, 208, 143, .12); --bad: #FF8F85; --bad-bg: rgba(255, 143, 133, .12); --margin: #D86A6A;
    --code-bg: #0F151B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1217; --grid: rgba(124, 155, 255, .045); --sheet: #151C23; --ink: #E6EBEF; --ink-2: #A4B1BD; --ink-3: #74828E;
  --rule: #26303A; --hl: rgba(255, 214, 60, .32); --hl-strong: #F2CC3A; --cobalt: #86A2FF; --cobalt-soft: rgba(134, 162, 255, .13);
  --good: #57D08F; --good-bg: rgba(87, 208, 143, .12); --bad: #FF8F85; --bad-bg: rgba(255, 143, 133, .12); --margin: #D86A6A;
  --code-bg: #0F151B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
a { color: var(--cobalt); }
mark {
  color: inherit;
  background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 94%, transparent 94%);
  padding: 0 .12em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eyebrow { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--sheet);
  border-bottom: 1px solid var(--rule);
}
.top-inner {
  max-width: 1080px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; flex: none; }
.brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
.brand-mark i { border-radius: 2px; background: var(--ink); }
.brand-mark i:nth-child(1) { background: var(--hl-strong); }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  font-size: .94rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
}
.nav button:hover { color: var(--ink); background: var(--cobalt-soft); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--hl); font-weight: 700; }
.badge { font-family: var(--f-mono); font-size: .72rem; background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 0 7px; line-height: 1.6; }

/* ---------- page shell ---------- */
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.foot {
  max-width: 1080px; margin: 0 auto;
  padding-block: 0 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--ink-3); font-size: var(--step--1); display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.on { background: var(--good); }
.dot.warn { background: var(--hl-strong); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--ink); color: var(--sheet); border: 1px solid var(--ink);
  padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .96rem;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover:not(:disabled) { box-shadow: 0 0 0 4px var(--hl); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink); box-shadow: none; background: var(--cobalt-soft); }
.btn.small { padding: 6px 12px; font-size: .86rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--cobalt); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero h1 { font-size: var(--step-4); font-weight: 800; letter-spacing: -.035em; margin-top: 6px; }
.hero h1 span { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 .06em; }
.lede { color: var(--ink-2); font-size: var(--step-1); max-width: 34ch; margin-top: 12px; line-height: 1.5; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
.stats { padding: 18px; display: grid; gap: 16px; }
.level-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.level-name { font-family: var(--f-display); font-weight: 800; font-size: var(--step-2); }
.xp { font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--code-bg); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { border-top: 1px solid var(--rule); padding-top: 10px; }
.kpi b { display: block; font-family: var(--f-display); font-size: var(--step-2); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: var(--step--1); color: var(--ink-3); }
.hier { display: grid; gap: 6px; }
.hier-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hier-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-family: var(--f-mono); font-size: var(--step--1); }
.hier-row .lbl { color: var(--ink-2); }
.hier-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.hier-track { height: 14px; border-radius: 3px; background: var(--code-bg); overflow: hidden; }
.hier-track i { display: block; height: 100%; border-radius: 3px; background: var(--ink-3); min-width: 0; }
.hier-row:nth-child(5) .hier-track i { background: var(--hl-strong); }
.hier-row:nth-child(4) .hier-track i { background: var(--cobalt); }
.hier-note { font-size: var(--step--1); color: var(--ink-3); }

.today { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-top: 32px; }
.today .panel { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.today h2 { font-size: var(--step-2); }
.today p { color: var(--ink-2); }
.today .actions { margin-top: auto; padding-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.continue { position: relative; overflow: hidden; }
.continue .big-n { position: absolute; right: 14px; top: -18px; font-family: var(--f-display); font-weight: 800; font-size: 8rem; color: var(--cobalt-soft); line-height: 1; pointer-events: none; }
.continue > *:not(.big-n) { position: relative; }

.track { margin-top: 40px; }
.track-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.track-head h2 { font-size: var(--step-2); }
.track-head p { color: var(--ink-3); }
.lessons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.lrow {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: start;
  padding: 14px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%;
}
.lrow:hover { background: var(--cobalt-soft); }
.lrow .num { font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-3); padding-top: 3px; font-variant-numeric: tabular-nums; }
.lrow h3 { font-size: var(--step-1); font-weight: 700; }
.lrow p { color: var(--ink-2); font-size: .93rem; margin-top: 2px; }
.lrow .meta { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); margin-top: 6px; }
.pill { font-family: var(--f-mono); font-size: .72rem; border-radius: 999px; padding: 2px 9px; white-space: nowrap; border: 1px solid var(--rule); color: var(--ink-3); }
.pill.done { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.prog { background: var(--hl); color: var(--ink); border-color: transparent; }

/* ---------- lesson player ---------- */
.player { max-width: 760px; margin: 0 auto; }
.player-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.player-top .where { font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-3); }
.segs { display: flex; gap: 3px; width: 100%; }
.segs i { flex: 1; height: 6px; border-radius: 2px; background: var(--rule); }
.segs i.seen { background: var(--ink-3); }
.segs i.ok { background: var(--good); }
.segs i.miss { background: var(--bad); }
.segs i.cur { background: var(--hl-strong); }
.sheet {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: clamp(20px, 4vw, 40px);
  display: flex; flex-direction: column; gap: 18px;
  min-height: 320px;
}
.sheet h2 { font-size: var(--step-3); font-weight: 700; }
.sheet .body { font-size: var(--step-1); line-height: 1.6; max-width: 62ch; }
.sheet .body ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 6px; }
.kind { display: inline-flex; gap: 8px; align-items: center; }
.kind i { width: 10px; height: 10px; border-radius: 2px; background: var(--ink-3); }
.kind.check i { background: var(--cobalt); }
.kind.iv i { background: var(--hl-strong); }
.kind.recap i { background: var(--good); }
.hook-n { font-family: var(--f-display); font-weight: 800; font-size: clamp(4rem, 14vw, 7rem); line-height: .9; color: var(--ink); letter-spacing: -.04em; }
.hook-title { font-size: var(--step-3) !important; font-weight: 800 !important; }
.hook-text { font-size: var(--step-2); line-height: 1.45; font-family: var(--f-body); max-width: 40ch; }
.hook-meta { display: flex; gap: 8px; flex-wrap: wrap; }
pre.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; font-family: var(--f-mono); font-size: .84rem; line-height: 1.6; color: var(--ink);
}
pre.code .c { color: var(--ink-3); font-style: italic; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .93rem; }
.tbl th { text-align: left; font-family: var(--f-mono); font-weight: 600; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); background: var(--code-bg); }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-weight: 700; white-space: nowrap; }
.note { border-left: 3px solid var(--hl-strong); background: var(--cobalt-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; color: var(--ink); font-size: .96rem; }
.note b.lbl { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 2px; font-weight: 600; }

.q { font-family: var(--f-display); font-size: var(--step-2); font-weight: 700; line-height: 1.25; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--sheet); cursor: pointer; font-size: 1rem; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt .key { font-family: var(--f-mono); font-size: .8rem; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink-3); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .key { background: var(--good); color: var(--sheet); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--sheet); border-color: var(--bad); }
.opt.dim { opacity: .55; }
.myth-claim { font-family: var(--f-display); font-size: var(--step-2); font-weight: 700; line-height: 1.3; border-left: 4px solid var(--ink); padding-left: 16px; }
.myth-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.myth-btns .opt { grid-template-columns: 1fr; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: var(--step-1); }
.verdict { border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.verdict.ok { background: var(--good-bg); }
.verdict.no { background: var(--bad-bg); }
.verdict strong { font-family: var(--f-display); font-size: var(--step-1); }
.verdict.ok strong { color: var(--good); }
.verdict.no strong { color: var(--bad); }
.verdict p { color: var(--ink); }
.order-area { display: grid; gap: 14px; }
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: ord; }
.order-list li { counter-increment: ord; }
.order-list .opt::before { content: counter(ord); font-family: var(--f-mono); font-size: .8rem; width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--sheet); display: grid; place-items: center; }
.order-list.empty { border: 1.5px dashed var(--rule); border-radius: 10px; padding: 16px; color: var(--ink-3); text-align: center; font-size: .93rem; }
.pool { display: grid; gap: 8px; }
.pool .opt { grid-template-columns: 1fr; }
.small-lbl { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.result-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.result-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: .96rem; }
.result-list .mk { font-family: var(--f-mono); font-weight: 600; }
.result-list .mk.ok { color: var(--good); }
.result-list .mk.no { color: var(--bad); }

.player-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.player-nav .hint { color: var(--ink-3); font-size: var(--step--1); text-align: center; flex: 1; }

/* interview */
.iv { display: grid; gap: 14px; }
.iv-q { font-size: var(--step-2) !important; font-weight: 700; line-height: 1.3 !important; }
textarea {
  width: 100%; min-height: 180px; resize: vertical; font: inherit; font-size: 1rem; line-height: 1.6; color: var(--ink);
  background: var(--sheet);
  background-image: repeating-linear-gradient(transparent 0, transparent calc(1.6em - 1px), var(--rule) calc(1.6em - 1px), var(--rule) 1.6em);
  background-position: 0 calc(14px - 1px);
  border: 1.5px solid var(--rule); border-radius: 10px; padding: 14px 16px; line-height: 1.6em;
}
textarea:focus { outline: none; border-color: var(--ink); }
.iv-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.iv-row .wc { margin-left: auto; font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.iv-msg { font-size: .93rem; color: var(--ink-2); }
.iv-msg.err { color: var(--bad); }
.thinking { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px dashed var(--rule); border-radius: 10px; color: var(--ink-2); }
.thinking .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--hl-strong); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }
.fb { border: 1.5px solid var(--ink); border-radius: 12px; padding: 18px; display: grid; gap: 14px; background: var(--sheet); }
.fb-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.score-pill { font-family: var(--f-display); font-weight: 800; font-size: var(--step-1); padding: 2px 12px; border-radius: 999px; background: var(--code-bg); }
.score-pill.s4, .score-pill.s5 { background: var(--good-bg); color: var(--good); }
.score-pill.s3 { background: var(--hl); color: var(--ink); }
.score-pill.s1, .score-pill.s2 { background: var(--bad-bg); color: var(--bad); }
.ticks { display: flex; gap: 4px; }

.fb-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.fb-cols h4 { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }
.fb-cols ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .96rem; }
.fb-extra { display: grid; gap: 8px; font-size: .98rem; }

.model { border-top: 1px solid var(--rule); padding-top: 16px; display: grid; gap: 12px; font-size: 1rem; }
.model h3 { font-size: var(--step-1); }
.model ul.rubric { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.model ul.rubric li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.model ul.rubric li::before { content: ""; width: 12px; height: 12px; margin-top: 6px; border: 1.5px solid var(--ink-2); border-radius: 3px; }

.model .answer pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-family: var(--f-mono); font-size: .84rem; margin: 0; }

/* recap */
.cheat { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.cheat li { padding: 10px 0 10px 28px; border-bottom: 1px solid var(--rule); position: relative; font-size: 1.02rem; }
.cheat li::before { content: "→"; position: absolute; left: 4px; color: var(--ink-3); font-family: var(--f-mono); }
.recap-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.recap-stats div b { display: block; font-family: var(--f-display); font-size: var(--step-3); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.recap-stats div span { font-size: var(--step--1); color: var(--ink-3); }
.done-banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; background: var(--good-bg); border-radius: 10px; color: var(--good); font-weight: 700; }

/* ---------- review ---------- */
.review { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
.review-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.review-head h1 { font-size: var(--step-3); font-weight: 800; }
.index-card {
  position: relative; background: var(--sheet); border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--rule);
  min-height: 300px; padding: 46px clamp(18px, 5vw, 40px) 26px;
  background-image:
    linear-gradient(var(--margin), var(--margin)),
    repeating-linear-gradient(transparent 0, transparent 31px, var(--cobalt-soft) 31px, var(--cobalt-soft) 32px);
  background-size: 100% 2px, 100% 100%;
  background-position: 0 34px, 0 34px;
  background-repeat: no-repeat, repeat;
  display: flex; flex-direction: column; gap: 14px;
}
.index-card .tier { position: absolute; top: 9px; left: clamp(18px, 5vw, 40px); font-family: var(--f-mono); font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.index-card .src { position: absolute; top: 9px; right: clamp(18px, 5vw, 40px); font-family: var(--f-mono); font-size: .72rem; color: var(--ink-3); max-width: 60%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.index-card .front { font-family: var(--f-display); font-size: var(--step-2); font-weight: 700; line-height: 1.3; }
.index-card .back { font-size: var(--step-1); line-height: 1.55; border-top: 2px dashed var(--rule); padding-top: 14px; }
.index-card .acts { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.grade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.grade-btns .btn { width: 100%; }
.review-empty { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 40px 20px; }
.review-empty h2 { font-size: var(--step-3); }
.review-empty p { color: var(--ink-2); max-width: 46ch; }
.tier-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tier-legend div { border-top: 3px solid var(--ink-3); padding-top: 6px; font-size: var(--step--1); color: var(--ink-2); }
.tier-legend div b { display: block; font-family: var(--f-mono); color: var(--ink); }
.tier-legend div:nth-child(3) { border-color: var(--cobalt); }
.tier-legend div:nth-child(4) { border-color: var(--hl-strong); }

/* ---------- gym + notes ---------- */
.page-head { display: grid; gap: 8px; margin-bottom: 24px; max-width: 64ch; }
.page-head h1 { font-size: var(--step-3); font-weight: 800; }
.page-head p { color: var(--ink-2); }
.gym-group { margin-top: 28px; }
.gym-group > h2 { font-size: var(--step-1); border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
.gym-item { border-bottom: 1px solid var(--rule); }
.gym-btn { width: 100%; background: none; border: 0; text-align: left; padding: 14px 4px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; cursor: pointer; align-items: start; }
.gym-btn:hover { background: var(--cobalt-soft); }
.gym-btn .t { font-size: 1.02rem; }
.gym-btn .s { font-family: var(--f-mono); font-size: .74rem; color: var(--ink-3); display: block; margin-top: 3px; }
.gym-body { padding: 4px 0 24px; }
.notes-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.note-card { padding: 20px; display: grid; gap: 10px; align-content: start; }
.note-card h3 { font-size: var(--step-1); }
.note-card.locked { opacity: .55; box-shadow: none; background: transparent; border-style: dashed; }
.note-card .cheat li { font-size: .95rem; }

/* ---------- settings ---------- */
.settings { max-width: 760px; display: grid; gap: 18px; }
.set-card { padding: 22px; display: grid; gap: 12px; }
.set-card h2 { font-size: var(--step-2); }
.set-card p, .set-card li { color: var(--ink-2); }
.set-card ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.ai-state { display: flex; align-items: center; gap: 10px; font-weight: 700; flex-wrap: wrap; }
.ai-state .dot { width: 10px; height: 10px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .95rem; }
.field .help { font-size: var(--step--1); color: var(--ink-3); }
input[type="text"], input[type="url"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--sheet);
  border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 14px;
}
input[type="text"]:focus, input[type="url"]:focus { outline: none; border-color: var(--ink); }
textarea.short { min-height: 96px; }
pre.cmd { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-family: var(--f-mono); font-size: .85rem; }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--good-bg); color: var(--good); font-weight: 700; }
.notice.err { background: var(--bad-bg); color: var(--bad); }
.danger { color: var(--bad); border-color: var(--bad) !important; }

@media (max-width: 820px) {
  .hero, .today { grid-template-columns: minmax(0, 1fr); }
  .lessons, .notes-grid { grid-template-columns: minmax(0, 1fr); }
}

  .fb-cols { grid-template-columns: minmax(0, 1fr); }

  .continue .big-n { font-size: 6rem; }
  .player-nav .hint { display: none; }
  .tier-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
