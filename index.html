<body>

<header class="top">
  <div class="top-inner">
    <button class="brand" data-act="nav" data-view="home" aria-label="Cache Warmup home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">Cache Warmup</span>
    </button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="foot" id="foot"><span class="dot"></span><span>Loading your progress…</span></footer>

<!-- Lessons: one file each. Adding a lesson? Drop a file in lessons/ and add a line here (see CONTRIBUTING.md). -->
<script>window.LESSONS = [];</script>
<script src="lessons/01-big-o.js"></script>
<script src="lessons/02-data-structures.js"></script>
<script src="lessons/03-oop-and-solid.js"></script>
<script src="lessons/04-design-patterns.js"></script>
<script src="lessons/05-indexes-and-query-plans.js"></script>
<script src="lessons/06-transactions-and-locks.js"></script>
<script src="lessons/07-concurrency-and-jobs.js"></script>
<script src="lessons/08-http-and-apis.js"></script>
<script src="lessons/09-caching.js"></script>
<script src="lessons/10-distributed-systems.js"></script>
<script src="lessons/11-system-design.js"></script>
<script src="lessons/12-testing.js"></script>
<script src="lessons/13-security.js"></script>
<script src="lessons/14-telling-your-story.js"></script>
<script src="lessons/extra-questions.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- static data ---------- */
  const LESSONS = (window.LESSONS || []).slice().sort((a, b) => a.n - b.n);
  const BY = Object.fromEntries(LESSONS.map(l => [l.id, l]));
  const EXTRAS = window.GYM_EXTRAS || [];
  const TRACKS = [
    ["Foundations", "How code grows and how it's shaped."],
    ["Data", "Where most production surprises come from."],
    ["Systems", "Jobs, networks, caches, and the space between services."],
    ["Craft", "Tests, security, and the story you tell about your work."]
  ];
  const LEVELS = [[0, "Intern"], [150, "Junior"], [400, "Mid-level"], [800, "Senior"], [1300, "Staff"], [2000, "Principal"], [3000, "Distinguished"]];
  const TIERS = [
    { name: "Disk", days: 1, blurb: "New or missed. Back tomorrow." },
    { name: "RAM", days: 3, blurb: "Remembered once. Back in 3 days." },
    { name: "L2", days: 7, blurb: "Getting warm. Back in a week." },
    { name: "L1", days: 16, blurb: "Hot. Checked every ~2 weeks." }
  ];
  const XP = { check: 10, lesson: 30, iv: 25, card: 2 };
  const SCORE = ["", "No hire yet", "Lean no", "Lean hire", "Hire", "Strong hire"];
  const LS_KEY = "cache-warmup:v1";

  /* ---------- state ---------- */
  const blank = () => ({ v: 1, xp: 0, done: {}, pos: {}, checks: {}, iv: {}, cards: {}, days: [], hits: 0, misses: 0, last: null });
  let S = blank();
  const ui = { view: "home", lesson: null, gymOpen: null, review: null, order: {}, busy: {}, err: {}, showModel: {} };
  let store = { kind: "local", ref: null, status: "pending" };

  /* AI feedback has two possible backends:
     - "artifact": the page runs as a claude.ai artifact and asks Claude directly.
     - "bridge":   serve.mjs (npm start) relays the prompt to an AI tool you already use.
     With neither, the app still works; answers are compared with the written strong answer. */
  const ai = { mode: null, label: "", usage: "", checked: false, serverUp: false, sample: null, base: "" };
  const PREFS_KEY = "cache-warmup:prefs";
  let prefs = { bridgeUrl: "" };
  try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) { /* ignore */ }
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ } }

  /* ---------- utils ---------- */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => ymd(new Date());
  function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); }
  function prettyDate(s) {
    if (!s) return "";
    const t = today();
    if (s === t) return "today";
    if (s === addDays(t, 1)) return "tomorrow";
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffled(n, seed) {
    const a = Array.from({ length: n }, (_, i) => i);
    let s = hash(seed) || 1;
    for (let i = n - 1; i > 0; i--) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      const j = s % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function highlight(code) {
    return esc(code).split("\n").map(line => {
      const t = line.trimStart();
      if (t.startsWith("#") || t.startsWith("--") || t.startsWith("&lt;%#")) return '<span class="c">' + line + "</span>";
      const m = line.match(/^(.*?\S.*?)(\s{2,}#\s.*|\s#\s(?!\{).*)$/);
      if (m) return m[1] + '<span class="c">' + m[2] + "</span>";
      return line;
    }).join("\n");
  }
  const words = s => (s || "").trim() ? s.trim().split(/\s+/).length : 0;

  function normalize(d) {
    const s = Object.assign(blank(), d && typeof d === "object" ? d : {});
    for (const k of ["done", "pos", "checks", "iv", "cards"]) if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = {};
    if (!Array.isArray(s.days)) s.days = [];
    s.xp = Number(s.xp) || 0; s.hits = Number(s.hits) || 0; s.misses = Number(s.misses) || 0;
    return s;
  }
  const hasProgress = () => S.xp > 0 || Object.keys(S.checks).length > 0 || Object.keys(S.iv).length > 0;

  /* ---------- persistence ---------- */
  let saving = false, dirty = false, draftTimer = null;
  function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
  function save() {
    writeLocal();
    if (store.kind !== "db") return;
    dirty = true;
    if (!saving) flush();
  }
  async function flush() {
    saving = true;
    while (dirty) {
      dirty = false;
      try {
        await store.ref.set(JSON.parse(JSON.stringify(S)));
        if (store.status !== "db") { store.status = "db"; renderFoot(); }
      } catch (e) {
        const code = e && e.code;
        if (code === "invalid_argument" || code === "revoked" || code === "not_granted") { store = { kind: "local", ref: null, status: "error" }; }
        else { store.status = "error"; }
        renderFoot();
        break;
      }
    }
    saving = false;
  }
  function saveDraftSoon() { clearTimeout(draftTimer); draftTimer = setTimeout(save, 900); }
  function touchDay() { const t = today(); if (!S.days.includes(t)) { S.days.push(t); if (S.days.length > 500) S.days = S.days.slice(-500); } }

  async function detectBridge() {
    const base = (prefs.bridgeUrl || "").trim().replace(/\/+$/, "");
    if (!base && !/^https?:$/.test(location.protocol)) return null;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 3000);
    try {
      const res = await fetch(base + "/api/ai/status", { cache: "no-store", signal: ctl.signal });
      if (!res.ok) return null;
      const data = await res.json();
      return Object.assign({ base }, data);
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }
  async function detectAI() {
    ai.checked = false;
    render();
    if (ai.sample) {
      Object.assign(ai, { mode: "artifact", label: "Claude", usage: "your Claude account" });
    } else {
      const b = await detectBridge();
      ai.serverUp = !!b;
      if (b && b.enabled) Object.assign(ai, { mode: "bridge", base: b.base, label: b.label || "AI", usage: b.usage || "" });
      else Object.assign(ai, { mode: null, base: "", label: "", usage: "" });
    }
    ai.checked = true;
    render();
  }
  function parseLooseJson(text) {
    const t = String(text || "").replace(/\x1b\[[0-9;]*[A-Za-z]/g, "").trim();
    try { return JSON.parse(t); } catch (e) { /* keep looking */ }
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) { try { return JSON.parse(fence[1]); } catch (e) { /* keep looking */ } }
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* give up */ } }
    return null;
  }
  async function aiJson(prompt, signal) {
    if (ai.mode === "artifact") return ai.sample.json(prompt, { signal });
    if (ai.mode !== "bridge") throw { code: "not_granted" };
    let res;
    try {
      res = await fetch(ai.base + "/api/ai/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }), signal
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled" };
      throw { code: "bridge_down" };
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw { code: (data.error && data.error.code) || "upstream_error", message: data.error && data.error.message };
    const parsed = parseLooseJson(data.text);
    if (!parsed) throw { code: "invalid_json" };
    return parsed;
  }

  async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { store.status = "local"; renderFoot(); detectAI(); return; }
    c.use("sample").then(fn => { ai.sample = fn || null; detectAI(); }).catch(() => detectAI());
    try {
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { store.status = "local"; renderFoot(); return; }
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      store = { kind: "db", ref, status: "db" };
      if (snap.exists) { S = normalize(snap.data()); writeLocal(); }
      else if (hasProgress()) { save(); }
      renderFoot();
      render();
    } catch (e) {
      store = { kind: "local", ref: null, status: "error" };
      renderFoot();
    }
  }

  /* ---------- derived ---------- */
  function levelInfo() {
    let i = 0;
    while (i + 1 < LEVELS.length && S.xp >= LEVELS[i + 1][0]) i++;
    const [base, name] = LEVELS[i];
    const next = LEVELS[i + 1];
    return { name, base, next: next ? next[0] : null, nextName: next ? next[1] : null, pct: next ? Math.min(100, ((S.xp - base) / (next[0] - base)) * 100) : 100 };
  }
  function streak() {
    const set = new Set(S.days);
    let d = today();
    if (!set.has(d)) d = addDays(d, -1);
    let n = 0;
    while (set.has(d)) { n++; d = addDays(d, -1); }
    return n;
  }
  const stepsOf = l => [{ k: "hook" }, ...l.steps, { k: "interview" }, { k: "recap" }];
  const isCheck = st => st.k === "mcq" || st.k === "myth" || st.k === "order";
  function lessonStats(l) {
    let total = 0, correct = 0, answered = 0;
    stepsOf(l).forEach((st, i) => {
      if (!isCheck(st)) return;
      total++;
      const c = S.checks[l.id + ":" + i];
      if (c) { answered++; if (c.ok) correct++; }
    });
    return { total, correct, answered };
  }
  function lessonStatus(l) {
    if (S.done[l.id]) return "done";
    if ((S.pos[l.id] || 0) > 0) return "prog";
    return "new";
  }
  function nextLesson() {
    if (S.last && BY[S.last] && !S.done[S.last]) return BY[S.last];
    return LESSONS.find(l => !S.done[l.id]) || null;
  }
  function dueCards() {
    const t = today();
    return Object.entries(S.cards).filter(([k, c]) => c.due <= t && cardText(k)).sort((a, b) => a[1].due.localeCompare(b[1].due) || a[1].box - b[1].box).map(([k]) => k);
  }
  function cardText(key) {
    const [id, i] = key.split(":");
    const l = BY[id];
    const c = l && l.cards[Number(i)];
    return c ? { front: c[0], back: c[1], lesson: l } : null;
  }
  function tierCounts() {
    const n = [0, 0, 0, 0];
    for (const c of Object.values(S.cards)) n[Math.max(0, Math.min(3, c.box | 0))]++;
    return n;
  }
  function nextDueDate() {
    const ds = Object.values(S.cards).map(c => c.due).sort();
    return ds[0] || null;
  }
  function ivDef(key) {
    const l = BY[key];
    if (l) return { key, q: l.interview.q, rubric: l.interview.rubric, model: l.interview.model, topic: "Lesson " + l.n + " · " + l.title };
    const x = EXTRAS.find(e => e.id === key);
    return x ? { key, q: x.q, rubric: null, model: null, topic: x.topic } : null;
  }

  /* ---------- rendering ---------- */
  const view = document.getElementById("view");
  const nav = document.getElementById("nav");
  const foot = document.getElementById("foot");

  function renderNav() {
    const due = dueCards().length;
    const items = [["home", "Path"], ["review", "Review"], ["gym", "Interview gym"], ["notes", "Cheat sheets"], ["settings", "Settings"]];
    const active = ui.view === "lesson" ? "home" : ui.view;
    nav.innerHTML = items.map(([v, label]) =>
      `<button data-act="nav" data-view="${v}"${active === v ? ' aria-current="page"' : ""}>${label}${v === "review" && due ? ` <span class="badge" aria-label="${due} due">${due}</span>` : ""}</button>`
    ).join("");
  }
  function renderFoot() {
    const map = {
      pending: ["", "Loading your progress…"],
      db: ["on", "Progress syncs to your Claude account. Only you can see it."],
      local: ["on", "Progress is saved in this browser. Settings → Export moves it to another one."],
      error: ["warn", "Couldn't reach sync. Progress is kept in this browser for now."]
    };
    const [cls, txt] = map[store.status] || map.local;
    foot.innerHTML = `<span class="dot ${cls}"></span><span>${txt}</span>`;
  }

  function render() {
    const ae = document.activeElement;
    const keep = ae && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && /^(text|url)$/.test(ae.type))) && ae.id ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd, top: ae.scrollTop } : null;
    renderNav();
    let html = "";
    if (ui.view === "lesson" && BY[ui.lesson]) html = renderLesson(BY[ui.lesson]);
    else if (ui.view === "review") html = renderReview();
    else if (ui.view === "gym") html = renderGym();
    else if (ui.view === "notes") html = renderNotes();
    else if (ui.view === "settings") html = renderSettings();
    else { ui.view = "home"; html = renderHome(); }
    view.innerHTML = html;
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch (e) { } el.scrollTop = keep.top; }
    }
  }

  function renderHome() {
    const lv = levelInfo();
    const done = Object.keys(S.done).filter(id => BY[id]).length;
    const total = S.hits + S.misses;
    const rate = total ? Math.round((S.hits / total) * 100) + "%" : "–";
    const tiers = tierCounts();
    const maxT = Math.max(1, ...tiers);
    const nl = nextLesson();
    const due = dueCards().length;
    const nd = nextDueDate();
    const cardsTotal = Object.keys(S.cards).length;

    const hier = TIERS.map((t, i) => ({ t, n: tiers[i] })).reverse().map(({ t, n }) =>
      `<div class="hier-row"><span class="lbl">${t.name}</span><span class="hier-track"><i style="width:${(n / maxT) * 100}%"></i></span><span class="n">${n}</span></div>`
    ).join("");

    let cont;
    if (nl) {
      const st = lessonStatus(nl);
      const pos = S.pos[nl.id] || 0;
      const steps = stepsOf(nl).length;
      cont = `<div class="panel continue">
        <span class="big-n" aria-hidden="true">${String(nl.n).padStart(2, "0")}</span>
        <p class="eyebrow">${st === "prog" ? "Pick up where you left off" : done ? "Up next" : "Start here"} · ${esc(nl.track)}</p>
        <h2>${esc(nl.title)}</h2>
        <p>${esc(nl.tag)}</p>
        <div class="actions">
          <button class="btn" data-act="open" data-id="${nl.id}">${st === "prog" ? `Continue · step ${pos + 1} of ${steps}` : `Start lesson ${nl.n}`}</button>
          <span class="xp">~${nl.mins} min</span>
        </div>
      </div>`;
    } else {
      cont = `<div class="panel continue">
        <p class="eyebrow">All 14 lessons done</p>
        <h2>The whole syllabus is in cache.</h2>
        <p>Keep it warm with reviews, and do a few gym reps before any interview.</p>
        <div class="actions"><button class="btn" data-act="nav" data-view="gym">Go to the interview gym</button></div>
      </div>`;
    }
    const rev = `<div class="panel">
      <p class="eyebrow">Review</p>
      <h2>${due ? `${due} card${due === 1 ? "" : "s"} going cold` : cardsTotal ? "Cache is warm" : "No cards yet"}</h2>
      <p>${due ? "A few minutes of recall now keeps them from dropping back to disk." : cardsTotal ? `Next review ${esc(prettyDate(nd))}.` : "Finish a lesson and its flashcards land here, spaced out over days."}</p>
      <div class="actions">${due ? `<button class="btn" data-act="review-start" data-mode="due">Review ${due}</button>` : cardsTotal ? `<button class="btn ghost" data-act="review-start" data-mode="cram">Practice anyway</button>` : ""}</div>
    </div>`;

    const tracks = TRACKS.map(([name, blurb]) => {
      const ls = LESSONS.filter(l => l.track === name);
      if (!ls.length) return "";
      return `<section class="track">
        <div class="track-head"><h2>${esc(name)}</h2><p>${esc(blurb)}</p></div>
        <div class="lessons">${ls.map(lessonRow).join("")}</div>
      </section>`;
    }).join("");

    return `<section class="hero">
        <div>
          <p class="eyebrow">Fundamentals refresh · ${LESSONS.length} lessons · a few at a time</p>
          <h1>Cache <span>Warmup</span></h1>
          <p class="lede">The fundamentals are still in there, just sitting in cold storage. Short lessons, quick checks, and interview reps to bring them back up to L1.</p>
        </div>
        <div class="panel stats">
          <div class="level-row"><span class="level-name">${esc(lv.name)}</span><span class="xp">${S.xp} XP${lv.next ? ` · ${lv.next - S.xp} to ${esc(lv.nextName)}` : " · max level"}</span></div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(lv.pct)}" aria-label="Progress to next level"><i style="width:${lv.pct}%"></i></div>
          <div class="kpis">
            <div class="kpi"><b>${done}/${LESSONS.length}</b><span>lessons</span></div>
            <div class="kpi"><b>${streak()}</b><span>day streak</span></div>
            <div class="kpi"><b>${rate}</b><span>recall hit rate</span></div>
          </div>
          <div class="hier">
            <div class="hier-head"><span class="eyebrow">Memory hierarchy</span><span class="hier-note">${cardsTotal} cards</span></div>
            ${hier}
            <p class="hier-note">Cards move toward L1 each time you remember them, and drop back to disk when you don't.</p>
          </div>
        </div>
      </section>
      <section class="today">${cont}${rev}</section>
      ${tracks}`;
  }

  function lessonRow(l) {
    const st = lessonStatus(l);
    const steps = stepsOf(l).length;
    const pill = st === "done" ? `<span class="pill done">done · ${lessonStats(l).correct}/${lessonStats(l).total}</span>`
      : st === "prog" ? `<span class="pill prog">${(S.pos[l.id] || 0) + 1}/${steps}</span>`
      : `<span class="pill">${l.mins} min</span>`;
    return `<button class="lrow" data-act="open" data-id="${l.id}">
      <span class="num">${String(l.n).padStart(2, "0")}</span>
      <span><h3>${esc(l.title)}</h3><p>${esc(l.tag)}</p></span>
      ${pill}
    </button>`;
  }

  /* ----- lesson player ----- */
  function renderLesson(l) {
    const steps = stepsOf(l);
    let pos = Math.max(0, Math.min(steps.length - 1, S.pos[l.id] || 0));
    const st = steps[pos];
    const key = l.id + ":" + pos;
    const segs = steps.map((s, i) => {
      let c = "";
      if (i === pos) c = "cur";
      else if (isCheck(s) && S.checks[l.id + ":" + i]) c = S.checks[l.id + ":" + i].ok ? "ok" : "miss";
      else if (i < pos || S.done[l.id]) c = "seen";
      return `<i class="${c}"></i>`;
    }).join("");

    let body = "";
    if (st.k === "hook") body = renderHook(l);
    else if (st.k === "read") body = renderRead(st);
    else if (st.k === "mcq") body = renderMcq(st, key);
    else if (st.k === "myth") body = renderMyth(st, key);
    else if (st.k === "order") body = renderOrder(st, key);
    else if (st.k === "interview") body = `<span class="eyebrow kind iv"><i></i>Interview rep · +${XP.iv} XP</span>` + renderInterview(l.id);
    else if (st.k === "recap") body = renderRecap(l);

    const blocked = isCheck(st) && !S.checks[key];
    const last = pos === steps.length - 1;
    const hint = blocked ? "Answer to continue" : st.k === "interview" ? "Writing an answer is optional, but it's the best part" : "";
    return `<div class="player">
      <div class="player-top">
        <button class="btn ghost small" data-act="nav" data-view="home">← Path</button>
        <span class="where">Lesson ${l.n} · step ${pos + 1} of ${steps.length}</span>
        <div class="segs" aria-hidden="true">${segs}</div>
      </div>
      <article class="sheet" aria-live="polite">${body}</article>
      <div class="player-nav">
        <button class="btn ghost" data-act="prev"${pos === 0 ? " disabled" : ""}>Back</button>
        <span class="hint">${hint}</span>
        ${last ? `<button class="btn ghost" data-act="nav" data-view="home">Done</button>` : `<button class="btn" data-act="next"${blocked ? " disabled" : ""}>${st.k === "hook" ? "Let's go" : st.k === "interview" ? (S.iv[l.id] && S.iv[l.id].draft ? "Wrap up" : "Skip for now") : "Next"}</button>`}
      </div>
    </div>`;
  }

  function renderHook(l) {
    const reads = l.steps.filter(s => s.k === "read").length;
    const checks = l.steps.filter(isCheck).length;
    return `<span class="eyebrow">${esc(l.track)} · ~${l.mins} min</span>
      <div class="hook-n" aria-hidden="true">${String(l.n).padStart(2, "0")}</div>
      <h2 class="hook-title">${esc(l.title)}</h2>
      <p class="hook-text">${l.hook}</p>
      <div class="hook-meta">
        <span class="pill">${reads} short reads</span>
        <span class="pill">${checks} quick checks</span>
        <span class="pill">1 interview rep</span>
        <span class="pill">${l.cards.length} flashcards</span>
      </div>`;
  }
  function renderTable(t) {
    return `<div class="tbl"><table><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function renderRead(st) {
    return `<span class="eyebrow kind"><i></i>Concept</span>
      <h2>${esc(st.t)}</h2>
      <div class="body">${st.b}</div>
      ${st.table ? renderTable(st.table) : ""}
      ${st.code ? `<pre class="code"><code>${highlight(st.code)}</code></pre>` : ""}
      ${st.note ? `<aside class="note"><b class="lbl">From the field</b>${st.note}</aside>` : ""}`;
  }
  function verdictBox(ok, why, extra) {
    return `<div class="verdict ${ok ? "ok" : "no"}"><strong>${ok ? `Correct · +${XP.check} XP` : "Not quite"}</strong>${extra || ""}<p>${why}</p></div>`;
  }
  function renderMcq(st, key) {
    const ans = S.checks[key];
    const order = shuffled(st.o.length, key);
    const opts = order.map((oi, idx) => {
      let cls = "opt";
      if (ans) cls += oi === st.a ? " right" : oi === ans.pick ? " wrong" : " dim";
      return `<button class="${cls}" data-act="pick" data-i="${oi}"${ans ? " disabled" : ""}><span class="key">${"ABCDEF"[idx]}</span><span>${st.o[oi]}</span></button>`;
    }).join("");
    return `<span class="eyebrow kind check"><i></i>Quick check</span>
      <p class="q">${st.q}</p>
      ${st.code ? `<pre class="code"><code>${highlight(st.code)}</code></pre>` : ""}
      <div class="opts">${opts}</div>
      ${ans ? verdictBox(ans.ok, st.why) : ""}`;
  }
  function renderMyth(st, key) {
    const ans = S.checks[key];
    const b = (v, label) => {
      let cls = "opt";
      if (ans) cls += v === st.a ? " right" : v === ans.pick ? " wrong" : " dim";
      return `<button class="${cls}" data-act="myth" data-v="${v ? 1 : 0}"${ans ? " disabled" : ""}>${label}</button>`;
    };
    return `<span class="eyebrow kind check"><i></i>Myth or fact?</span>
      <p class="myth-claim">${st.q}</p>
      <div class="myth-btns">${b(true, "Fact")}${b(false, "Myth")}</div>
      ${ans ? verdictBox(ans.ok, st.why, `<p><b>${st.a ? "Fact." : "Myth."}</b></p>`) : ""}`;
  }
  function renderOrder(st, key) {
    const ans = S.checks[key];
    const n = st.items.length;
    if (ans) {
      const seq = ans.seq || [];
      const list = seq.map((oi, i) => `<li><span class="mk ${oi === i ? "ok" : "no"}">${oi === i ? "✓" : "✗"}</span><span>${esc(st.items[oi])}</span></li>`).join("");
      const correct = st.items.map((t, i) => `<li><span class="mk">${i + 1}.</span><span>${esc(t)}</span></li>`).join("");
      const right = seq.filter((oi, i) => oi === i).length;
      return `<span class="eyebrow kind check"><i></i>Put it in order</span>
        <p class="q">${st.q}</p>
        <div><p class="small-lbl">Your order · ${right}/${n} in place</p><ul class="result-list">${list}</ul></div>
        ${ans.ok ? "" : `<div><p class="small-lbl">Correct order</p><ul class="result-list">${correct}</ul></div>`}
        ${verdictBox(ans.ok, st.why)}`;
    }
    let base = shuffled(n, key);
    if (base.every((v, i) => v === i)) base = base.slice(1).concat(base[0]);
    const seq = (ui.order[key] = ui.order[key] || []);
    const pool = base.filter(i => !seq.includes(i));
    return `<span class="eyebrow kind check"><i></i>Put it in order</span>
      <p class="q">${st.q}</p>
      <div class="order-area">
        <p class="small-lbl">Your sequence · tap an item to remove it</p>
        ${seq.length ? `<ol class="order-list">${seq.map(i => `<li><button class="opt" style="grid-template-columns:28px minmax(0,1fr)" data-act="order-remove" data-i="${i}"><span>${esc(st.items[i])}</span></button></li>`).join("")}</ol>` : `<div class="order-list empty">Tap the steps below in the order they happen.</div>`}
        ${pool.length ? `<p class="small-lbl">Steps to place · ${pool.length} left</p><div class="pool">${pool.map(i => `<button class="opt" data-act="order-add" data-i="${i}">${esc(st.items[i])}</button>`).join("")}</div>` : ""}
        <div class="iv-row"><button class="btn" data-act="order-check"${pool.length ? " disabled" : ""}>Check order</button>${seq.length ? `<button class="btn ghost small" data-act="order-reset">Start over</button>` : ""}</div>
      </div>`;
  }

  function renderRecap(l) {
    const s = lessonStats(l);
    const done = S.done[l.id];
    const ivDone = S.iv[l.id] && S.iv[l.id].xp;
    return `<span class="eyebrow kind recap"><i></i>Cheat sheet</span>
      <h2>${esc(l.title)}, on one card</h2>
      <ul class="cheat">${l.cheat.map(c => `<li>${c}</li>`).join("")}</ul>
      <div class="recap-stats">
        <div><b>${s.correct}/${s.total}</b><span>checks right</span></div>
        <div><b>${ivDone ? "✓" : "–"}</b><span>interview rep</span></div>
        <div><b>${l.cards.length}</b><span>cards to warm</span></div>
      </div>
      ${done
        ? `<div class="done-banner">Finished ${esc(prettyDate(done.at) === "today" ? "today" : "on " + prettyDate(done.at))}. Its cards are in your review deck.</div>
           <div class="iv-row"><button class="btn" data-act="nav" data-view="home">Back to the path</button><button class="btn ghost" data-act="nav" data-view="notes">All cheat sheets</button></div>`
        : `<div class="iv-row"><button class="btn" data-act="finish">Finish lesson · +${XP.lesson} XP</button><span class="iv-msg">Adds ${l.cards.length} flashcards. First review is tomorrow.</span></div>`}`;
  }

  /* ----- interview component (lessons + gym) ----- */
  function renderInterview(key) {
    const def = ivDef(key);
    const st = S.iv[key] || {};
    const busy = ui.busy[key];
    const err = ui.err[key];
    const show = ui.showModel[key];
    let action;
    if (busy) action = "";
    else if (ai.mode) action = `<button class="btn" data-act="iv-ask" data-key="${key}" title="Uses ${esc(ai.label)}">${st.fb ? "Get fresh feedback" : "Get interviewer feedback"}</button>`;
    else if (!ai.checked) action = `<button class="btn" disabled>Looking for AI feedback…</button>`;
    else action = "";
    const modelBtn = def.model || def.rubric
      ? `<button class="btn ghost" data-act="iv-model" data-key="${key}">${show ? "Hide the strong answer" : "Compare with a strong answer"}</button>` : "";
    let out = "";
    if (busy) out = `<div class="thinking"><span class="pulse"></span><span>The interviewer is reading your answer…</span><button class="btn ghost small" data-act="iv-stop" data-key="${key}" style="margin-left:auto">Stop</button></div>`;
    else if (err) out = `<p class="iv-msg err">${esc(err)}</p>`;
    if (!busy && st.fb) out += renderFeedback(st.fb, st.fbAt);
    if (ai.checked && !ai.mode && !def.model) {
      out += `<div class="model"><h3>Self-check</h3><ul class="rubric">
        <li>Did you open with a direct answer, then add detail?</li>
        <li>Did you give one concrete example from your own work?</li>
        <li>Did you name at least one trade-off or failure mode?</li>
        <li>Could a non-expert follow it in under two minutes?</li></ul></div>`;
    }
    const model = show ? `<div class="model">
        ${def.rubric ? `<h3>What a strong answer covers</h3><ul class="rubric">${def.rubric.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
        ${def.model ? `<h3>One way to say it</h3><div class="answer">${def.model}</div>` : ""}
      </div>` : "";
    const draft = st.draft || "";
    return `<div class="iv">
      <h2 class="iv-q">“${esc(def.q)}”</h2>
      <label class="sr" for="iv-${key}">Your answer</label>
      <textarea id="iv-${key}" data-iv="${key}" placeholder="Answer the way you'd say it out loud. Bullets are fine. Aim for 150–300 words.">${esc(draft)}</textarea>
      <div class="iv-row">${action}${modelBtn}<span class="wc" id="wc-${key}">${words(draft)} words</span></div>
      ${ai.checked && !ai.mode ? `<p class="iv-msg">AI feedback is off, so compare with the strong answer for now. <button class="linkish" data-act="nav" data-view="settings">Turn on AI feedback</button> (about a minute).</p>` : ai.mode && !busy ? `<p class="iv-msg">Feedback comes from ${esc(ai.label)}${ai.usage ? `, using ${esc(ai.usage)}` : ""}.</p>` : ""}
      ${out}
      ${model}
    </div>`;
  }
  function renderFeedback(fb, at) {
    const s = Math.max(1, Math.min(5, Math.round(Number(fb.score) || 0)));
    const list = a => (Array.isArray(a) ? a : []).slice(0, 5).map(x => `<li>${esc(x)}</li>`).join("");
    return `<div class="fb">
      <div class="fb-head">
        <span class="score-pill s${s}">${SCORE[s]}</span>
        <span class="ticks" aria-label="${s} out of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</span>
        ${at ? `<span class="fb-when">${esc(prettyDate(at))}</span>` : ""}
      </div>
      ${fb.verdict ? `<p class="fb-verdict">${esc(fb.verdict)}</p>` : ""}
      <div class="fb-cols">
        <div><h4>What landed</h4><ul>${list(fb.strengths) || "<li>–</li>"}</ul></div>
        <div><h4>What was missing</h4><ul>${list(fb.gaps) || "<li>Nothing major.</li>"}</ul></div>
      </div>
      <div class="fb-extra">
        ${fb.tip ? `<p><b>Next time:</b> ${esc(fb.tip)}</p>` : ""}
        ${fb.followup ? `<p><b>They'd ask next:</b> ${esc(fb.followup)}</p>` : ""}
      </div>
    </div>`;
  }
  function feedbackPrompt(def, answer) {
    return `You are a friendly but rigorous senior engineering interviewer at a strong product company.
About the candidate: ${(S.profile || "").trim() ? S.profile.trim().slice(0, 600) : "a software engineer (seniority unknown)"}.
They are practicing to keep fundamentals fresh, not cramming. Calibrate expectations to their stated level.

Interview question:
${def.q}

${def.rubric ? "A strong answer usually covers:\n- " + def.rubric.join("\n- ") : "Judge it as a senior-level interviewer would: correctness, depth, a concrete example, trade-offs, and clarity."}

Candidate's answer:
"""
${answer.slice(0, 8000)}
"""

Evaluate this specific answer and refer to what they actually wrote. Be direct and encouraging, in plain, casual language. Keep each list item under 25 words. Max 4 strengths and 4 gaps.
Reply with only JSON in this shape:
{"score": 3, "verdict": "one-sentence overall read", "strengths": ["..."], "gaps": ["..."], "tip": "one concrete thing to say differently next time", "followup": "the follow-up question you would ask next"}
score is an integer from 1 to 5: 1 = no hire, 2 = lean no, 3 = lean hire, 4 = hire, 5 = strong hire.`;
  }
  const ctls = {};
  async function askFeedback(key) {
    const def = ivDef(key);
    const el = document.getElementById("iv-" + key);
    const answer = (el ? el.value : "").trim();
    const st = (S.iv[key] = S.iv[key] || {});
    st.draft = answer;
    if (words(answer) < 25) { ui.err[key] = "Write a bit more first. At least a few sentences gives the interviewer something to react to."; render(); return; }
    if (!ai.mode) return;
    ui.err[key] = null;
    const ctl = new AbortController();
    ctls[key] = ctl;
    ui.busy[key] = true;
    save();
    render();
    try {
      const fb = await aiJson(feedbackPrompt(def, answer), ctl.signal);
      if (!fb || typeof fb !== "object") throw { code: "invalid_json" };
      st.fb = { score: fb.score, verdict: String(fb.verdict || ""), strengths: (fb.strengths || []).map(String), gaps: (fb.gaps || []).map(String), tip: String(fb.tip || ""), followup: String(fb.followup || "") };
      st.fbAt = today();
      if (!st.xp) { st.xp = true; S.xp += XP.iv; }
      touchDay();
      save();
    } catch (e) {
      const code = e && e.code;
      const msgs = {
        rate_limited: "Too many requests right now. Give it a minute and try again.",
        invalid_json: "The feedback came back garbled. Try again.",
        refused: "Claude couldn't grade that one. Try rephrasing your answer.",
        empty_completion: "No feedback came back. Try again, maybe with a slightly shorter answer.",
        session_expired: "Your Claude session expired. Sign in again, then retry.",
        prompt_too_large: "That answer is too long to grade. Trim it a little.",
        bridge_down: "Can't reach the local server anymore. Is `npm start` still running? Your answer is saved.",
        busy: "Another answer is being graded. Give it a moment, then try again.",
        timeout: "The AI tool took too long to answer. Try again in a bit.",
        provider_error: e && e.message ? "The AI tool reported a problem: " + e.message : "The AI tool reported a problem. Check the terminal running npm start."
      };
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
        if (ai.mode === "artifact") { ai.sample = null; Object.assign(ai, { mode: null }); }
        ui.err[key] = null;
      } else if (code !== "cancelled") {
        ui.err[key] = msgs[code] || (e && e.message) || "Couldn't get feedback. Your answer is saved, so try again.";
      }
    } finally {
      ui.busy[key] = false;
      delete ctls[key];
      render();
    }
  }

  /* ----- review ----- */
  function startReview(mode) {
    let queue = mode === "cram" ? shuffled(Object.keys(S.cards).length, "cram" + Date.now()).map(i => Object.keys(S.cards)[i]) : dueCards();
    queue = queue.filter(cardText).slice(0, 20);
    ui.review = { mode, queue, i: 0, flipped: false, got: 0, fuzzy: 0 };
    ui.view = "review";
    render();
  }
  function renderReview() {
    const r = ui.review;
    const tiersLegend = `<div class="tier-legend">${TIERS.map(t => `<div><b>${t.name}</b>${t.blurb}</div>`).join("")}</div>`;
    if (!r) {
      const due = dueCards().length;
      const total = Object.keys(S.cards).length;
      return `<div class="review">
        <div class="review-head"><h1>Review</h1><span class="xp">${total} cards in deck</span></div>
        <div class="panel review-empty">
          <h2>${due ? `${due} card${due === 1 ? "" : "s"} due` : total ? "Nothing due right now" : "Your deck is empty"}</h2>
          <p>${due ? "Flip each card, then say honestly whether you knew it. Remembered cards move up a tier and come back later." : total ? `Next cards come due ${esc(prettyDate(nextDueDate()))}. You can still practice without moving anything between tiers.` : "Each lesson you finish adds its flashcards here. They come back on a schedule so they stick."}</p>
          ${due ? `<button class="btn" data-act="review-start" data-mode="due">Start review</button>` : total ? `<button class="btn ghost" data-act="review-start" data-mode="cram">Practice all ${total}</button>` : `<button class="btn" data-act="nav" data-view="home">Go to the path</button>`}
        </div>
        ${tiersLegend}
      </div>`;
    }
    if (r.i >= r.queue.length) {
      return `<div class="review">
        <div class="review-head"><h1>${r.mode === "cram" ? "Practice done" : "Review done"}</h1></div>
        <div class="panel review-empty">
          <h2>${r.got} remembered · ${r.fuzzy} fuzzy</h2>
          <p>${r.mode === "cram" ? "Practice runs don't move cards between tiers." : r.fuzzy ? "The fuzzy ones went back to disk and will show up tomorrow." : "Everything moved up a tier. Nice."}</p>
          <div class="iv-row" style="justify-content:center"><button class="btn" data-act="nav" data-view="home">Back to the path</button>${dueCards().length ? `<button class="btn ghost" data-act="review-start" data-mode="due">Review ${dueCards().length} more</button>` : ""}</div>
        </div>
        ${tiersLegend}
      </div>`;
    }
    const key = r.queue[r.i];
    const c = cardText(key);
    const meta = S.cards[key] || { box: 0 };
    return `<div class="review">
      <div class="review-head"><h1>${r.mode === "cram" ? "Practice" : "Review"}</h1><span class="xp">${r.i + 1} / ${r.queue.length}</span></div>
      <div class="index-card">
        <span class="tier">In ${TIERS[meta.box | 0].name}</span>
        <span class="src">${String(c.lesson.n).padStart(2, "0")} · ${esc(c.lesson.title)}</span>
        <p class="front">${esc(c.front)}</p>
        ${r.flipped ? `<p class="back">${esc(c.back)}</p>` : ""}
        <div class="acts">
          ${r.flipped
            ? `<div class="grade-btns"><button class="btn ghost" data-act="grade" data-v="0">Fuzzy</button><button class="btn" data-act="grade" data-v="1">Got it</button></div>`
            : `<button class="btn" data-act="flip">Show answer</button>`}
        </div>
      </div>
      <p class="hier-note">Say the answer out loud before you flip. It sticks better.</p>
    </div>`;
  }
  function grade(got) {
    const r = ui.review;
    if (!r) return;
    const key = r.queue[r.i];
    if (r.mode === "due" && S.cards[key]) {
      const c = S.cards[key];
      if (got) { c.box = Math.min(3, (c.box | 0) + 1); c.due = addDays(today(), TIERS[c.box].days); S.hits++; }
      else { c.box = 0; c.due = addDays(today(), 1); S.misses++; }
      S.xp += XP.card;
      touchDay();
      save();
    }
    if (got) r.got++; else r.fuzzy++;
    r.i++;
    r.flipped = false;
    render();
  }

  /* ----- gym ----- */
  function gymRow(key, title, sub) {
    const st = S.iv[key];
    const open = ui.gymOpen === key;
    const pill = st && st.fb ? `<span class="pill ${Number(st.fb.score) >= 4 ? "done" : "prog"}">${SCORE[Math.max(1, Math.min(5, Math.round(Number(st.fb.score) || 1)))]}</span>`
      : st && st.draft ? `<span class="pill">draft</span>` : "";
    return `<div class="gym-item">
      <button class="gym-btn" data-act="gym-open" data-key="${key}" aria-expanded="${open}">
        <span><span class="t">${esc(title)}</span><span class="s">${esc(sub)}</span></span>${pill}
      </button>
      ${open ? `<div class="gym-body">${renderInterview(key)}</div>` : ""}
    </div>`;
  }
  function renderGym() {
    const fromLessons = LESSONS.map(l => gymRow(l.id, l.interview.q, "Lesson " + l.n + " · " + l.title)).join("");
    const extras = EXTRAS.map(x => gymRow(x.id, x.q, x.topic)).join("");
    const reps = Object.values(S.iv).filter(v => v && v.fb).length;
    return `<div class="page-head">
        <p class="eyebrow">Interview gym · ${reps} rep${reps === 1 ? "" : "s"} with feedback</p>
        <h1>Practice saying it out loud</h1>
        <p>Pick a question, write the answer you'd give in the room, and get a mock interviewer's read: a hire/no-hire signal, what landed, what was missing, and the follow-up they'd ask next. Questions from lessons you haven't done yet are fair game too.</p>
      </div>
      <section class="gym-group"><h2>From the lessons</h2>${fromLessons}</section>
      <section class="gym-group"><h2>Extra reps</h2>${extras}</section>`;
  }

  /* ----- notes ----- */
  function renderNotes() {
    const doneN = LESSONS.filter(l => S.done[l.id]).length;
    const cards = LESSONS.map(l => S.done[l.id]
      ? `<div class="panel note-card"><p class="eyebrow">${String(l.n).padStart(2, "0")} · ${esc(l.track)}</p><h3>${esc(l.title)}</h3><ul class="cheat">${l.cheat.map(c => `<li>${c}</li>`).join("")}</ul></div>`
      : `<div class="panel note-card locked"><p class="eyebrow">${String(l.n).padStart(2, "0")} · ${esc(l.track)}</p><h3>${esc(l.title)}</h3><p class="iv-msg">Finish the lesson to unlock its cheat sheet.</p></div>`
    ).join("");
    return `<div class="page-head">
        <p class="eyebrow">${doneN} of ${LESSONS.length} unlocked</p>
        <h1>Cheat sheets</h1>
        <p>One card per lesson. Skim these the night before an interview.</p>
      </div>
      <div class="notes-grid">${cards}</div>`;
  }

  /* ----- settings ----- */
  function renderSettings() {
    let status;
    if (!ai.checked) status = `<div class="ai-state"><span class="dot"></span>Looking for an AI tool…</div>`;
    else if (ai.mode) status = `<div class="ai-state"><span class="dot on"></span>On · ${esc(ai.label)}</div><p>${ai.usage ? `Feedback uses ${esc(ai.usage)}.` : ""} Nothing else leaves your machine: only the question, the rubric, your answer, and the "About you" note below.</p>`;
    else if (ai.serverUp) status = `<div class="ai-state"><span class="dot warn"></span>Server is running, but it found no AI tool</div>
      <p>Install or log in to one of these, then restart <code>npm start</code>: Claude Code, Codex CLI, Gemini CLI, OpenCode, or Ollama. The README lists every option.</p>`;
    else status = `<div class="ai-state"><span class="dot warn"></span>Off</div>
      <p>The lessons work fine without it. To get a mock interviewer that grades your answers:</p>
      <ol>
        <li>Have one AI tool installed and logged in. Claude Code is the smoothest, and it uses your Claude plan instead of API credits. Codex CLI, Gemini CLI, OpenCode, and Ollama also work.</li>
        <li>In the project folder, run:<pre class="cmd">npm start</pre></li>
        <li>Use the page it opens (<code>http://localhost:4317</code>). It finds your tool on its own.</li>
      </ol>`;
    const exportNote = ui.notice ? `<p class="notice${ui.notice.err ? " err" : ""}">${esc(ui.notice.text)}</p>` : "";
    return `<div class="page-head">
        <p class="eyebrow">Settings</p>
        <h1>Make it yours</h1>
        <p>Everything here is optional. Settings and progress stay in this browser unless you export them.</p>
      </div>
      <div class="settings">
        <section class="panel set-card">
          <p class="eyebrow">AI feedback</p>
          ${status}
          <div class="iv-row"><button class="btn ghost small" data-act="ai-recheck">Check again</button></div>
          <details>
            <summary>Advanced: use a server on another address</summary>
            <div class="field" style="margin-top:12px">
              <label for="bridge-url">Server address</label>
              <input type="url" id="bridge-url" placeholder="http://localhost:4317" value="${esc(prefs.bridgeUrl)}">
              <span class="help">Only needed if you open the app from somewhere other than the server itself (a static host, for example). Leave empty normally. The server also has to allow this page's address: see "Hosting it yourself" in the README.</span>
            </div>
            <div class="iv-row" style="margin-top:10px"><button class="btn small" data-act="bridge-save">Save and check</button></div>
          </details>
        </section>

        <section class="panel set-card">
          <p class="eyebrow">About you</p>
          <div class="field">
            <label for="profile">What should the interviewer know about you?</label>
            <textarea id="profile" class="short" data-profile placeholder="Example: Senior backend engineer, 6 years. Mostly Python and Django, some Go. Payments and logistics.">${esc(S.profile || "")}</textarea>
            <span class="help">Used to calibrate the feedback (a junior and a staff engineer get graded differently). It's sent with each answer you submit for feedback.</span>
          </div>
        </section>

        <section class="panel set-card">
          <p class="eyebrow">Your progress</p>
          <p>Move your progress to another browser or computer, or keep a backup.</p>
          ${exportNote}
          <div class="iv-row">
            <button class="btn ghost small" data-act="export">Export progress</button>
            <label class="btn ghost small" for="import-file" style="cursor:pointer">Import progress</label>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
            ${ui.confirmReset
              ? `<span class="iv-msg">This erases all XP, answers, and cards.</span><button class="btn small danger" data-act="reset-confirm">Yes, reset everything</button><button class="btn ghost small" data-act="reset-cancel">Keep it</button>`
              : `<button class="btn ghost small" data-act="reset-ask">Reset…</button>`}
          </div>
        </section>
      </div>`;
  }
  function exportProgress() {
    try {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cache-warmup-progress-" + today() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      ui.notice = { text: "Exported. Look for cache-warmup-progress-" + today() + ".json in your downloads." };
    } catch (e) {
      ui.notice = { err: true, text: "This browser blocked the download." };
    }
    render();
  }
  function importProgress(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || typeof data !== "object" || data.v !== 1) throw new Error("not a progress file");
        S = normalize(data);
        save();
        ui.notice = { text: "Imported. Welcome back: " + S.xp + " XP and " + Object.keys(S.done).length + " lessons done." };
      } catch (e) {
        ui.notice = { err: true, text: "That file doesn't look like a Cache Warmup progress export." };
      }
      render();
    };
    reader.readAsText(file);
  }

  /* ---------- actions ---------- */
  function openLesson(id) {
    const l = BY[id];
    if (!l) return;
    if (S.done[id] && (S.pos[id] || 0) >= stepsOf(l).length - 1) S.pos[id] = 0;
    S.last = id;
    ui.view = "lesson";
    ui.lesson = id;
    save();
    render();
    window.scrollTo(0, 0);
  }
  function move(delta) {
    const l = BY[ui.lesson];
    if (!l) return;
    const n = stepsOf(l).length;
    const el = document.querySelector("textarea[data-iv]");
    if (el) { const st = (S.iv[el.dataset.iv] = S.iv[el.dataset.iv] || {}); st.draft = el.value; }
    S.pos[l.id] = Math.max(0, Math.min(n - 1, (S.pos[l.id] || 0) + delta));
    save();
    render();
    window.scrollTo(0, 0);
  }
  function currentKey() { const l = BY[ui.lesson]; return l ? l.id + ":" + (S.pos[l.id] || 0) : null; }
  function currentStep() { const l = BY[ui.lesson]; return l ? stepsOf(l)[S.pos[l.id] || 0] : null; }
  function answer(ok, extra) {
    const key = currentKey();
    if (!key || S.checks[key]) return;
    S.checks[key] = Object.assign({ ok }, extra);
    if (ok) S.xp += XP.check;
    touchDay();
    save();
    render();
  }
  function finishLesson() {
    const l = BY[ui.lesson];
    if (!l || S.done[l.id]) return;
    const s = lessonStats(l);
    S.done[l.id] = { at: today(), correct: s.correct, total: s.total };
    S.xp += XP.lesson;
    l.cards.forEach((_, i) => { const k = l.id + ":" + i; if (!S.cards[k]) S.cards[k] = { box: 0, due: addDays(today(), 1) }; });
    if (S.last === l.id) S.last = null;
    touchDay();
    save();
    render();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    const act = t.dataset.act;
    switch (act) {
      case "nav":
        ui.view = t.dataset.view;
        ui.notice = null;
        ui.confirmReset = false;
        if (ui.view === "review") ui.review = null;
        render(); window.scrollTo(0, 0); break;
      case "open": openLesson(t.dataset.id); break;
      case "next": move(1); break;
      case "prev": move(-1); break;
      case "pick": { const st = currentStep(); const i = Number(t.dataset.i); answer(i === st.a, { pick: i }); break; }
      case "myth": { const st = currentStep(); const v = t.dataset.v === "1"; answer(v === st.a, { pick: v }); break; }
      case "order-add": { const k = currentKey(); (ui.order[k] = ui.order[k] || []).push(Number(t.dataset.i)); render(); break; }
      case "order-remove": { const k = currentKey(); ui.order[k] = (ui.order[k] || []).filter(i => i !== Number(t.dataset.i)); render(); break; }
      case "order-reset": { ui.order[currentKey()] = []; render(); break; }
      case "order-check": { const k = currentKey(); const seq = ui.order[k] || []; answer(seq.every((v, i) => v === i), { seq: seq.slice() }); break; }
      case "finish": finishLesson(); break;
      case "iv-ask": askFeedback(t.dataset.key); break;
      case "iv-stop": { const c = ctls[t.dataset.key]; if (c) c.abort(); break; }
      case "iv-model": {
        const key = t.dataset.key;
        ui.showModel[key] = !ui.showModel[key];
        const el = document.getElementById("iv-" + key);
        const st = (S.iv[key] = S.iv[key] || {});
        if (el) st.draft = el.value;
        if (ui.showModel[key] && !st.xp && words(st.draft) >= 40) { st.xp = true; S.xp += XP.iv; touchDay(); }
        save(); render(); break;
      }
      case "review-start": startReview(t.dataset.mode); break;
      case "flip": if (ui.review) { ui.review.flipped = true; render(); } break;
      case "grade": grade(t.dataset.v === "1"); break;
      case "gym-open": ui.gymOpen = ui.gymOpen === t.dataset.key ? null : t.dataset.key; render(); break;
      case "ai-recheck": detectAI(); break;
      case "bridge-save": {
        const el = document.getElementById("bridge-url");
        prefs.bridgeUrl = el ? el.value.trim() : "";
        savePrefs();
        detectAI();
        break;
      }
      case "export": exportProgress(); break;
      case "reset-ask": ui.confirmReset = true; ui.notice = null; render(); break;
      case "reset-cancel": ui.confirmReset = false; render(); break;
      case "reset-confirm":
        S = blank();
        ui.confirmReset = false;
        ui.order = {}; ui.err = {}; ui.showModel = {};
        save();
        ui.notice = { text: "Progress reset. Fresh start." };
        render();
        break;
    }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) importProgress(e.target.files[0]);
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.matches && el.matches("textarea[data-profile]")) { S.profile = el.value; saveDraftSoon(); return; }
    if (!el.matches || !el.matches("textarea[data-iv]")) return;
    const key = el.dataset.iv;
    const st = (S.iv[key] = S.iv[key] || {});
    st.draft = el.value;
    const wc = document.getElementById("wc-" + key);
    if (wc) wc.textContent = words(el.value) + " words";
    saveDraftSoon();
  });
  document.addEventListener("keydown", e => {
    if (ui.view !== "lesson" || e.target.closest("textarea, input")) return;
    if (e.key === "ArrowRight") { const b = document.querySelector('[data-act="next"]'); if (b && !b.disabled) move(1); }
    if (e.key === "ArrowLeft") { const b = document.querySelector('[data-act="prev"]'); if (b && !b.disabled) move(-1); }
  });

  /* ---------- boot ---------- */
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = normalize(JSON.parse(raw)); } catch (e) { /* ignore */ }
  // Deep links: #review, #gym, #notes, #settings open that section directly.
  function viewFromHash() {
    const h = location.hash.replace("#", "");
    if (["home", "review", "gym", "notes", "settings"].includes(h)) { ui.view = h; return true; }
    return false;
  }
  viewFromHash();
  window.addEventListener("hashchange", () => { if (viewFromHash()) { ui.review = null; render(); } });
  render();
  renderFoot();
  connect();
})();
</script>
</body>
</html>
