name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npx prettier --check .
      - name: Types
        run: npx tsc --noEmit
      - name: Tests (includes validating every lesson)
        run: npx vitest run
      - name: Build
        run: npx vite build
